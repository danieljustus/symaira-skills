name: Release App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-dmg:
    runs-on: macos-15
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Import signing certificate
        id: signing
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "${CERTIFICATE_P12:-}" ]; then
            echo "::warning::CERTIFICATE_P12 secret is not set. Building unsigned."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          echo -n "$CERTIFICATE_P12" | base64 --decode -o "$CERTIFICATE_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Derive app version from tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "APP_VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Build, Sign, and Package DMG
        env:
          APP_VERSION: ${{ env.APP_VERSION }}
        run: ./client/package.sh

      - name: Notarize DMG
        if: steps.signing.outputs.signed == 'true'
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
        run: |
          if [ -z "${NOTARY_API_KEY:-}" ]; then
            echo "::warning::NOTARY_API_KEY secret is not set. Skipping notarization."
            exit 0
          fi
          DMG="client/build/Symskills.dmg"
          if [ ! -f "$DMG" ]; then
            echo "::error::DMG not found at $DMG"
            exit 1
          fi
          KEY_FILE="$RUNNER_TEMP/notary-api-key.p8"
          echo "${NOTARY_API_KEY}" | base64 --decode > "$KEY_FILE"
          xcrun notarytool submit "$DMG" \
            --key "$KEY_FILE" \
            --key-id "${NOTARY_API_KEY_ID}" \
            --issuer "${NOTARY_API_ISSUER}" \
            --wait
          rm -f "$KEY_FILE"

      - name: Staple notarization ticket
        if: steps.signing.outputs.signed == 'true'
        run: |
          DMG="client/build/Symskills.dmg"
          if [ -f "$DMG" ]; then
            xcrun stapler staple "$DMG" || echo "::warning::Stapling failed — skipping"
          fi

      - name: Create Release and Upload DMG
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: client/build/Symskills.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew Cask
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "${HOMEBREW_TAP_GITHUB_TOKEN:-}" ]; then
            echo "::warning::HOMEBREW_TAP_GITHUB_TOKEN not set — skipping Cask update"
            exit 0
          fi
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          DMG="client/build/Symskills.dmg"
          SHA256=$(shasum -a 256 "$DMG" | cut -d' ' -f1)
          echo "Version: $VERSION  SHA256: $SHA256"

          git clone "https://x-access-token:${HOMEBREW_TAP_GITHUB_TOKEN}@github.com/danieljustus/homebrew-tap.git" tap
          cd tap
          mkdir -p Casks
          cat > "Casks/symskills.rb" << CASKRB
          cask "symskills" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "https://github.com/danieljustus/symaira-skills/releases/download/v#{version}/Symskills.dmg"
            name "Symskills"
            desc "Portable Skill SSOT manager for local AI agent harnesses"
            homepage "https://github.com/danieljustus/symaira-skills"

            livecheck do
              url "https://github.com/danieljustus/symaira-skills/releases/latest"
              strategy :header_match
              regex(/Symskills\.dmg/i)
            end

            depends_on macos: :sonoma

            app "Symskills.app"

            zap trash: [
              "~/Library/Application Support/dev.symaira.Symskills",
              "~/Library/Preferences/dev.symaira.Symskills.plist",
              "~/Library/Caches/dev.symaira.Symskills",
            ]
          end
          CASKRB

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/symskills.rb
          if git diff --cached --quiet; then
            echo "Cask unchanged — nothing to commit"
          else
            git commit -m "symskills ${TAG}"
            git push
            echo "Cask updated to ${VERSION}"
          fi

      - name: Clean up signing material
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi
