<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="title desc">
  <title id="title">Portable skill workflow: source, validate, render, install</title>
  <desc id="desc">A single portable skill source (SKILL.md, symskills.toml, overlays, references, scripts) is validated once, rendered per harness target (OpenCode, Claude Code, Codex, Hermes, Antigravity, OpenClaw, user-defined), and installed into each harness-specific skill directory. An edit to the source propagates to every harness, so copies never drift.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da"/>
    </marker>
  </defs>

  <!-- Stage 1: portable source -->
  <rect x="20" y="70" width="230" height="190" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="135" y="100" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#24292f">Portable skill source</text>
  <text x="135" y="118" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">one canonical copy</text>
  <line x1="50" y1="130" x2="220" y2="130" stroke="#d0d7de" stroke-width="1"/>
  <text x="40" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#57606a">SKILL.md</text>
  <text x="40" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#57606a">symskills.toml</text>
  <text x="40" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#57606a">overlays/&lt;target&gt;/</text>
  <text x="40" y="210" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#57606a">references/ · scripts/</text>
  <text x="40" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#57606a">assets/ · flows/</text>

  <!-- Arrow 1 -->
  <line x1="250" y1="165" x2="306" y2="165" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 2: validate -->
  <rect x="310" y="125" width="140" height="80" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="380" y="158" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#24292f">symskills validate</text>
  <text x="380" y="180" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">validated once</text>

  <!-- Arrow 2 -->
  <line x1="450" y1="165" x2="506" y2="165" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 3: render -->
  <rect x="510" y="70" width="230" height="190" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="625" y="100" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#24292f">symskills render</text>
  <text x="625" y="118" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">per-target output</text>
  <line x1="530" y1="130" x2="720" y2="130" stroke="#d0d7de" stroke-width="1"/>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#0969da">
    <rect x="525" y="140" width="64" height="22" rx="11" fill="#ddf4ff" stroke="#54aeff" stroke-width="1"/><text x="557" y="155" text-anchor="middle">opencode</text>
    <rect x="593" y="140" width="64" height="22" rx="11" fill="#ddf4ff" stroke="#54aeff" stroke-width="1"/><text x="625" y="155" text-anchor="middle">claude</text>
    <rect x="661" y="140" width="64" height="22" rx="11" fill="#ddf4ff" stroke="#54aeff" stroke-width="1"/><text x="693" y="155" text-anchor="middle">codex</text>
    <rect x="525" y="168" width="64" height="22" rx="11" fill="#ddf4ff" stroke="#54aeff" stroke-width="1"/><text x="557" y="183" text-anchor="middle">hermes</text>
    <rect x="593" y="168" width="64" height="22" rx="11" fill="#ddf4ff" stroke="#54aeff" stroke-width="1"/><text x="625" y="183" text-anchor="middle">antigravity</text>
    <rect x="661" y="168" width="64" height="22" rx="11" fill="#ddf4ff" stroke="#54aeff" stroke-width="1"/><text x="693" y="183" text-anchor="middle">openclaw</text>
    <rect x="525" y="196" width="200" height="22" rx="11" fill="#ddf4ff" stroke="#54aeff" stroke-width="1"/><text x="625" y="211" text-anchor="middle">user-defined targets</text>
  </g>
  <text x="625" y="240" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">overlays applied per target</text>

  <!-- Arrow 3 -->
  <line x1="740" y1="165" x2="796" y2="165" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 4: install -->
  <rect x="800" y="70" width="140" height="190" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="870" y="100" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#24292f">symskills install</text>
  <text x="870" y="118" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">harness dirs</text>
  <line x1="820" y1="130" x2="920" y2="130" stroke="#d0d7de" stroke-width="1"/>
  <text x="815" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#57606a">~/.config/opencode/</text>
  <text x="815" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#57606a">~/.claude/skills/</text>
  <text x="815" y="192" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#57606a">~/.agents/skills/</text>
  <text x="815" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#57606a">~/.hermes/skills/</text>
  <text x="815" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#57606a">… one dir per target</text>

  <!-- Feedback loop: edit source once, every harness updated -->
  <path d="M 870 268 L 870 310 L 135 310 L 135 264" fill="none" stroke="#0969da" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-blue)"/>
  <text x="480" y="300" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0969da">edit the source once — every harness receives the update, no drift</text>
</svg>
